name: Keep Supabase awake

# The free Supabase plan pauses a project after a week without database activity.
on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Query the database once
        env:
          KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::error::Add the SUPABASE_PUBLISHABLE_KEY secret (Settings > Secrets and variables > Actions)."
            exit 1
          fi
          curl -fsS -o /dev/null -w "HTTP %{http_code}\n" \
            -H "apikey: $KEY" \
            "https://rcvdnisyznxhwdfakhfl.supabase.co/rest/v1/site_leads?select=id&limit=1"
